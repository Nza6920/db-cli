# Omitted driver defaults to mysql.
[profiles.prod]
url = "jdbc:mysql://jms.example.cn:33061/"
username = "readonly_user"
password_env = "DB_QUERY_PROD_PASSWORD"
environment = "production"
# This server does not advertise MySQL TLS. Traffic may be unencrypted.
tls = "disabled"
connect_timeout_seconds = 5
query_timeout_seconds = 30
# Optional positive integer: maximum explicit SQL LIMIT count (default 1000).
max_rows = 1000

[profiles.uat]
url = "jdbc:mysql://uat-db.example.cn:3306/"
username = "readonly_user"
password_env = "DB_QUERY_UAT_PASSWORD"
environment = "staging"
tls = "required"
# Each profile can choose its own cap; SQL still needs an explicit LIMIT.
max_rows = 2000

[profiles.pg]
driver = "postgresql"
# PostgreSQL requires a database; single TCP host only, default port 5432.
url = "postgresql://pg.example.cn:5432/analytics"
username = "readonly_user"
password_env = "DB_QUERY_PG_PASSWORD"
environment = "staging"
tls = "required"
# Optional private CA bundle; required verifies the certificate and hostname.
# tls_ca_file = "/path/to/ca.pem"
connect_timeout_seconds = 5
# PostgreSQL server-side statement timeout; not an end-to-end deadline.
query_timeout_seconds = 30
max_rows = 1000
