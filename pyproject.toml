[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "db-query"
version = "0.2.0"
description = "Profile-aware, read-only MySQL queries for agents and automation"
requires-python = ">=3.11"
dependencies = ["PyMySQL[rsa]==1.2.0", "tabulate==0.10.0"]

[project.scripts]
db-query = "db_query.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
